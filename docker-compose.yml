version: '3.8'

services:
  reconx-postgres:
    image: postgres:16-alpine
    container_name: reconx-postgres
    restart: always
    environment:
      POSTGRES_USER: reconx_user
      POSTGRES_PASSWORD: reconx_secret_password
      POSTGRES_DB: reconx_db
    ports:
      - "5432:5432"
    volumes:
      - reconx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx_user -d reconx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reconx_pgdata:
