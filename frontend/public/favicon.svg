<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Background Decorative Grid Lines -->
  <path d="M12 32H52M32 12V52" stroke="#10b981" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Dual Crossing Settlement Vectors (The "X") -->
  <!-- Diagonal 1: Internal to Settlement -->
  <path d="M18 18L46 46" stroke="url(#emeraldTeal)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- Diagonal 2: Provider to Clearing -->
  <path d="M46 18L18 46" stroke="url(#cyanBlue)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Central Clearing Node -->
  <circle cx="32" cy="32" r="5.5" fill="#022c22" stroke="#34d399" stroke-width="2.5" />
  <circle cx="32" cy="32" r="2" fill="#34d399" />

  <!-- Checkmark Badge on Top Right Node -->
  <circle cx="46" cy="18" r="4.5" fill="#10b981" />
  <path d="M44 18L45.5 19.5L48.5 16.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Settlement Pulse on Bottom Left Node -->
  <circle cx="18" cy="46" r="3" fill="#38bdf8" />
</svg>
